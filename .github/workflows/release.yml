# 推送 v* 标签 → Windows runner 构建 → 生成「草稿」Release（人工核对后再点 Publish）
#
# 两种触发方式：
#   git tag v0.1.1 && git push origin v0.1.1
#   或在 Actions 页面手动运行，填一个已经存在于远端的 tag
#
# 注意：workflow 文件必须已经存在于 tag 指向的那个 commit 上，否则该 tag 不会触发构建。
# 草稿是刻意的：发布后（仓库若启用了 immutable releases）资产和 tag 会被锁死，且未签名
# 的 exe 值得先人工下载跑一遍。确认无误后在 Release 页面点 Publish release。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的标签，例如 v0.1.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # 三个 JS action 都用声明 node24 的主版本。v4 系列声明 node20，
      # runner 已在 2026-09-23 移除 Node 20，会把它们强制跑在 Node 24 上并报弃用警告。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}

      # 版本单一来源：src-tauri/tauri.conf.json。本地与 CI 共用一个校验脚本，
      # 只依赖 Node 内置模块，所以能放在 pnpm install 之前跑（尽早失败）。
      - name: 校验版本号与 tag 一致
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node scripts/check-version.mjs "$TAG"

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # tauri.conf.json 的 beforeBuildCommand 会自动跑 pnpm build（tsc --noEmit && vite build）
      # bundle.active=false：只输出 target/release/novel-reader.exe，不生成 NSIS 安装包
      - name: 构建前端 + 绿色版 exe
        run: pnpm tauri build

      # 复用现有发布脚本：同步 exe 到 release/ 并生成 SHA256SUMS.txt
      - name: 同步产物并生成校验和
        run: pnpm release

      - name: 创建草稿 Release 并上传两个产物
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          gh release create "$TAG" \
            "release/NovelReader.exe" \
            "release/SHA256SUMS.txt" \
            --title "Novel Reader $v" \
            --notes "免安装绿色版：下载 NovelReader.exe 放到任意目录双击即可，无需安装。首次运行若出现 Windows SmartScreen 提示，点「更多信息 → 仍要运行」，可用 SHA256SUMS.txt 核对文件完整性。卸载只需删除 exe；书架数据在 %APPDATA%\com.novelreader.app\library.db，不会随 exe 删除。" \
            --generate-notes \
            --verify-tag \
            --draft
          echo "草稿已生成：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
